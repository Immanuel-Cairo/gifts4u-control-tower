name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:/tmp/ci.sqlite

    strategy:
      fail-fast: false
      matrix:
        service:
          - printz-service
          - webshop-service

    defaults:
      run:
        working-directory: code/backend/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test
