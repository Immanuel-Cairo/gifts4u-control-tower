<text x="40" y="1181" font-size="17" fill="#151612" text-anchor="start" font-weight="400"><tspan x="40" dy="0">Alle acht doelen horen bij dezelfde beheerder. Lijnen betekenen deelname, geen procesvolgorde.</tspan></text>
<text x="40" y="1212" font-size="17" fill="#151612" text-anchor="start" font-weight="400"><tspan x="40" dy="0">Partnergegevens en uitgaande opdrachten staan in het DFD. Partners bedienen de Control Tower niet.</tspan></text>
