<text x="40" y="1292" font-size="17" fill="#151612" text-anchor="start" font-weight="400"><tspan x="40" dy="0">Rechthoek = externe partij. Afgerond proces 0 = volledige systeemgrens. Pijl = gegevens, geen fysieke goederen.</tspan></text>
<text x="40" y="1322" font-size="17" fill="#151612" text-anchor="start" font-weight="400"><tspan x="40" dy="0">F11 kan via de importcoördinator worden aangeleverd. Een automatische inkoopkoppeling is niet vastgesteld.</tspan></text>
<text x="40" y="1352" font-size="17" fill="#151612" text-anchor="start" font-weight="400"><tspan x="40" dy="0">Geen interne services of gegevensopslag uitgewerkt op dit niveau. Gegevenswoordenboek: README.md.</tspan></text>
