<text x="40" y="1292" font-size="17" fill="#151612" text-anchor="start" font-weight="400"><tspan x="40" dy="0">Rechthoek = externe entiteit. Cirkel 0 = volledige systeemgrens. Pijl = gegevens, geen fysieke goederen of navigatie.</tspan></text>
<text x="40" y="1322" font-size="17" fill="#151612" text-anchor="start" font-weight="400"><tspan x="40" dy="0">Externe partijen zijn gegevensbronnen of ontvangers van opdrachten; Tijd / klok levert de datum en tijd voor de looptijdcontrole.</tspan></text>
<text x="40" y="1352" font-size="17" fill="#151612" text-anchor="start" font-weight="400"><tspan x="40" dy="0">Geen interne services of gegevensopslag uitgewerkt op dit niveau. Gegevenswoordenboek: README.md.</tspan></text>
