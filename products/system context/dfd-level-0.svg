<text x="900" y="765" font-size="26" fill="#151612" text-anchor="middle" font-weight="700"><tspan x="900" dy="0">GIFTS4U Control Tower</tspan></text>
<text x="900" y="845" font-size="19" fill="#747870" text-anchor="middle" font-weight="400"><tspan x="900" dy="0">Informatie samenbrengen</tspan><tspan x="900" dy="25.650000000000002">Uitzonderingen en impact tonen</tspan><tspan x="900" dy="25.650000000000002">Acties en besluiten vastleggen</tspan></text>
