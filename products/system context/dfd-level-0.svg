<text x="1366.275" y="1022" font-size="14" fill="#151612" text-anchor="middle" font-weight="400"><tspan x="1366.275" dy="0">Update en opdracht</tspan></text>
<text x="40" y="1260" font-size="18" fill="#151612" text-anchor="start" font-weight="700"><tspan x="40" dy="0">Leeswijzer</tspan></text>
<text x="40" y="1292" font-size="17" fill="#151612" text-anchor="start" font-weight="400"><tspan x="40" dy="0">Rechthoek = externe partij. Cirkel 0 = volledige systeemgrens. Pijl = gegevens, geen fysieke goederen of navigatie.</tspan></text>
<text x="40" y="1322" font-size="17" fill="#151612" text-anchor="start" font-weight="400"><tspan x="40" dy="0">Externe partijen zijn gegevensbronnen of ontvangers van opdrachten; het zijn geen extra Control Tower-gebruikers.</tspan></text>
<text x="40" y="1352" font-size="17" fill="#151612" text-anchor="start" font-weight="400"><tspan x="40" dy="0">Geen interne services of gegevensopslag uitgewerkt op dit niveau. Gegevenswoordenboek: README.md.</tspan></text>
